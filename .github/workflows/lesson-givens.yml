name: Lesson clarity regression
on:
  pull_request:
    paths:
      - 'src/course/**'
      - 'src/components/**'
      - 'scripts/**'
      - 'docs/lesson-sources/**'
      - 'docs/course-enrichment-coverage.json'
      - 'docs/materials-import-manifest.json'
      - 'package*.json'
      - '.github/workflows/lesson-givens.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - name: Lint changed source
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          git diff --name-only --diff-filter=ACMRT "$BASE" HEAD -- '*.ts' '*.tsx' '*.mjs' | xargs -r npx eslint
      - run: npx playwright install --with-deps chromium
      - name: Development capstone evidence acceptance
        run: node scripts/browser-capstone-evidence.mjs
      - name: Production capstone evidence acceptance
        env:
          ACCEPTANCE_BUILD: '1'
        run: node scripts/browser-capstone-evidence.mjs
      - name: Development component acceptance
        run: |
          node scripts/browser-lesson-givens.mjs
          node scripts/assert-lesson-acceptance.mjs screenshots/lesson-givens/results.json
      - name: Production component acceptance
        env:
          ACCEPTANCE_BUILD: '1'
          ACCEPTANCE_OUT: screenshots/lesson-givens-built
        run: |
          node scripts/browser-lesson-givens.mjs
          node scripts/assert-lesson-acceptance.mjs screenshots/lesson-givens-built/results.json
      - name: Development course enrichment acceptance
        run: node scripts/browser-course-enrichment.mjs
      - name: Production course enrichment acceptance
        env:
          ACCEPTANCE_BUILD: '1'
          ACCEPTANCE_OUT: screenshots/course-enrichment-built
        run: node scripts/browser-course-enrichment.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: lesson-givens-acceptance
          path: |
            screenshots/lesson-givens/
            screenshots/lesson-givens-built/
            screenshots/course-enrichment/
            screenshots/course-enrichment-built/
            screenshots/capstone-evidence/
            screenshots/capstone-evidence-built/
          retention-days: 7
