name: Export merged lesson source
on:
  push:
    branches: [work/lesson-givens-build-20260930]
    paths: [.github/workflows/lesson-audit-workspace.yml]
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 0f3310af80ba988240477555c5f9235ca8e638c4
          persist-credentials: false
      - name: Export exact merged source
        run: git archive --format=tar.gz -o /tmp/trig-base-source.tar.gz HEAD
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: trig-base-source
          path: /tmp/trig-base-source.tar.gz
          retention-days: 1
