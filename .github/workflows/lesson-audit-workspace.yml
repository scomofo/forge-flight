name: Export lesson fix review workspace
on:
  push:
    branches: [work/lesson-givens-build-20260930]
    paths: [.github/workflows/lesson-audit-workspace.yml]
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 3993eb2d62ce24cce93de86fd9be31d871b69aa8
          persist-credentials: false
      - name: Export tracked source only
        run: git archive --format=tar.gz -o /tmp/lesson-fixes-source.tar.gz HEAD
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: lesson-fixes-source
          path: /tmp/lesson-fixes-source.tar.gz
          retention-days: 1
