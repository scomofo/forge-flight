name: Assemble scientific consistency changes
on:
  pull_request:
    paths:
      - '.work/science-edits-*.b64'
      - '.github/workflows/assemble-scientific-consistency.yml'
permissions:
  contents: write
jobs:
  assemble:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'codex/phase-stability-bonding-consistency'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - name: Verify and apply reviewed source
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, lzma, pathlib, subprocess
          root=pathlib.Path.cwd()
          encoded=''.join((root/f'.work/science-edits-{i}.b64').read_text().strip() for i in range(1,5))
          data=lzma.decompress(base64.b64decode(encoded,validate=True))
          assert hashlib.sha256(data).hexdigest()=='e705ae65fec72b5cc75d8f5a422cbd4c302e1877064db2d9af8efef8a4b27eb9', 'Payload integrity failure'
          changes=json.loads(data)
          allowed=set('''docs/course-enrichment-coverage.json
          docs/lesson-sources/materials-review.json
          docs/lesson-sources/materials-reviewed.md
          docs/materials-import-manifest.json
          docs/scientific-consistency-pass.md
          scripts/browser-scientific-consistency.mjs
          scripts/fixtures/lesson-assessment-contract.json
          scripts/import-materials-walkthroughs.mjs
          scripts/scientific-consistency.test.mjs
          src/components/bench/bonding-labs.tsx
          src/components/bench/materials-labs.tsx
          src/components/bench/phase-diagram.tsx
          src/components/bench/physics-labs.tsx
          src/components/bench/stability-sketch.tsx
          src/components/figures/materials-a.tsx
          src/components/figures/materials-b.tsx
          src/course/bonding.ts
          src/course/fluids.ts
          src/course/materials-w11.ts
          src/course/materials-w17.ts
          src/course/materials-walkthroughs.ts
          src/course/phase-assessment.ts
          src/course/phasediagrams.ts
          src/course/physics-enrichment.ts
          src/course/physics-w8.test.ts
          src/course/physics-w8.ts
          src/course/scientific-consistency.test.ts'''.splitlines())
          assert {c['path'] for c in changes}==allowed and len(changes)==len(allowed)
          outputs={}
          for item in changes:
              p=root/item['path']; assert p.resolve().is_relative_to(root)
              before=p.read_bytes() if p.exists() else None
              assert (hashlib.sha256(before).hexdigest() if before is not None else None)==item['before'],f'Concurrent source change: {item["path"]}'
              lines=(before or b'').decode().splitlines(keepends=True)
              for start,end,text in reversed(item['edits']):
                  assert 0<=start<=end<=len(lines)
                  lines[start:end]=[text]
              after=''.join(lines).encode()
              assert hashlib.sha256(after).hexdigest()==item['after'],f'Output hash mismatch: {item["path"]}'
              outputs[p]=after
          for p,after in outputs.items():
              p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes(after)
          subprocess.run(['git','add','--',*sorted(allowed)],check=True)
          PY
      - run: npm ci --ignore-scripts
      - name: Source freshness and registered tests
        run: |
          node scripts/import-materials-walkthroughs.mjs --check
          node --experimental-strip-types scripts/course-enrichment-coverage.mjs --check
          npm test
          npm run typecheck
      - name: Publish only the reviewed branch
        run: |
          git rm .work/science-edits-{1,2,3,4}.b64
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'fix: reconcile phase identities, stability teaching and bonding claims'
          git push origin HEAD:refs/heads/codex/phase-stability-bonding-consistency
          mkdir -p artifacts/science-assembled
          git rev-parse HEAD > artifacts/science-assembled/revision.txt
          git archive --format=zip --output=artifacts/science-assembled/source.zip HEAD
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: science-assembled-source
          path: artifacts/science-assembled/
          retention-days: 7
