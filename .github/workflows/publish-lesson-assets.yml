name: Publish requested lesson assets
on:
  push:
    branches: [enhancement/density-and-animation-pack]
    paths:
      - '.github/lesson-publication/**'
      - '.github/workflows/publish-lesson-assets.yml'
permissions:
  contents: write
jobs:
  publish:
    if: github.repository == 'scomofo/forge-flight' && github.ref == 'refs/heads/enhancement/density-and-animation-pack'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify and unpack authored source bundle
        shell: bash
        run: |
          cat .github/lesson-publication/source.part{0,1,2} > /tmp/lesson-source.tar.xz
          echo 'e2a02846e39ec2d7f277d77b409d619f9b811897ea2d7a8c22a11f25b76a9b2e  /tmp/lesson-source.tar.xz' | sha256sum -c -
          python - <<'PY'
          import tarfile
          from pathlib import Path
          root = Path.cwd().resolve()
          with tarfile.open('/tmp/lesson-source.tar.xz') as archive:
              for member in archive.getmembers():
                  target = (root / member.name).resolve()
                  if not target.is_relative_to(root) or member.issym() or member.islnk():
                      raise RuntimeError('Unsafe archive member: ' + member.name)
                  if target.exists():
                      raise RuntimeError('Refusing to replace existing bundle destination: ' + member.name)
              archive.extractall(root, filter='data')
          PY
      - name: Apply exact density clarification and verify curriculum invariants
        shell: bash
        run: |
          node --experimental-strip-types --input-type=module -e "import {mathLessons} from './src/course/math.ts'; console.log(JSON.stringify(mathLessons));" > /tmp/math-before.json
          python scripts/apply-density-clarification.py
          node --experimental-strip-types --input-type=module -e "import {mathLessons} from './src/course/math.ts'; console.log(JSON.stringify(mathLessons));" > /tmp/math-after.json
          python - <<'PY'
          import json
          before=json.load(open('/tmp/math-before.json'))
          after=json.load(open('/tmp/math-after.json'))
          for lesson in after:
              if lesson['id']=='powers':
                  original=next(x for x in before if x['id']=='powers')
                  lesson['example']=original['example']
                  lesson.pop('exampleHelp',None)
          assert before==after, 'Unrelated curriculum or assessment data changed'
          print('All math curriculum, quiz, bench and progression fields unchanged except requested worked-example/help additions.')
          PY
          mkdir -p docs/validation
          node --test scripts/density-given.test.mjs | tee docs/validation/density-given.tap
      - name: Install rendering tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-inter fonts-dejavu-core fonts-liberation
          python -m pip install -r tools/lesson-animations/source/requirements.txt
      - name: Render and verify all twelve animations
        run: |
          python tools/lesson-animations/source/render.py
          python tools/lesson-animations/source/verify_assets.py
          python tools/lesson-animations/source/package_gallery.py
          mkdir -p public/learn-media
          cp tools/lesson-animations/public/learn-media/* public/learn-media/
          cp tools/lesson-animations/integration/lesson-animation.tsx src/components/lesson-animation.tsx
          cp tools/lesson-animations/integration/animation-assets.ts src/course/animation-assets.ts
          cp tools/lesson-animations/review/asset-validation.json docs/validation/animation-assets.json
          python - <<'PY'
          from pathlib import Path
          root=Path('tools/lesson-animations')
          html=(root/'index.html').read_text().replace('public/learn-media/', './')
          Path('public/learn-media/index.html').write_text(html)
          assert len(list(Path('public/learn-media').glob('*.gif')))==12
          assert len(list(Path('public/learn-media').glob('*.mp4')))==12
          assert len(list(Path('public/learn-media').glob('*.png')))==12
          PY
      - name: Check application and record actual results
        shell: bash
        run: |
          set +e
          npm ci > /tmp/npm-ci.log 2>&1
          install=$?
          echo "npm ci exit: $install" | tee docs/validation/application-checks.txt
          if [ "$install" = 0 ]; then
            for script in typecheck test lint build:dev; do
              logfile="/tmp/check-${script//:/-}.log"
              npm run "$script" > "$logfile" 2>&1
              code=$?
              echo "$script exit: $code" | tee -a docs/validation/application-checks.txt
              tail -n 35 "$logfile"
            done
          else
            echo 'Application checks blocked by dependency installation failure.' | tee -a docs/validation/application-checks.txt
            tail -n 60 /tmp/npm-ci.log
          fi
          exit 0
      - name: Publish only requested files to the feature branch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/course/math.ts src/course/types.ts src/course/concept-help.ts src/course/animation-assets.ts
          git add src/components/lesson-view.tsx src/components/concept-help.tsx src/components/figures/math.tsx src/components/lesson-animation.tsx
          git add scripts/density-given.test.mjs docs/lesson-givens.md docs/validation tools/lesson-animations public/learn-media
          git diff --cached --check
          git commit -m 'content: supply aluminum density and publish explanatory animation pack'
          git push origin HEAD:refs/heads/enhancement/density-and-animation-pack
      - name: Save verification logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lesson-publication-verification
          path: |
            docs/validation/
            /tmp/npm-ci.log
            /tmp/check-*.log
          if-no-files-found: ignore
