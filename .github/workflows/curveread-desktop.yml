name: Curveread desktop regression
on:
  pull_request:
    paths:
      - 'src/course/**'
      - 'src/components/**'
      - 'scripts/**'
      - 'package*.json'
      - '.github/workflows/curveread-desktop.yml'
permissions:
  contents: read
jobs:
  desktop:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Use the runner's installed Chrome
        run: |
          BROWSER=$(command -v google-chrome || command -v chromium || command -v chromium-browser)
          "$BROWSER" --version
          echo "CHROMIUM_EXECUTABLE_PATH=$BROWSER" >> "$GITHUB_ENV"
      - name: Diagnose desktop module loading
        run: node scripts/curveread-loading-probe.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: curveread-desktop-results
          path: artifacts/curriculum-audit/browser/
          retention-days: 7
