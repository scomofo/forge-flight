name: Curveread desktop regression
on:
  pull_request:
    paths:
      - 'src/course/**'
      - 'src/components/**'
      - 'scripts/**'
      - 'package*.json'
      - '.github/workflows/curveread-desktop.yml'
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Registered regressions
        run: |
          mkdir -p artifacts/curveread-checks
          set -o pipefail
          npm test 2>&1 | tee artifacts/curveread-checks/tests.txt
      - run: npm run typecheck
      - run: npm run build
      - name: Lint desktop regression source
        run: npx eslint scripts/browser-curriculum-audit.mjs scripts/curriculum-browser-support.mjs scripts/curriculum-browser-support.test.mjs scripts/curveread-desktop-checks.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: curveread-unit-results
          path: artifacts/curveread-checks/
          retention-days: 7
  desktop:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - mode: development
            build: '0'
          - mode: production
            build: '1'
    env:
      ACCEPTANCE_BUILD: ${{ matrix.build }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Use the runner's installed Chrome
        run: |
          BROWSER=$(command -v google-chrome || command -v chromium || command -v chromium-browser)
          "$BROWSER" --version
          echo "CHROMIUM_EXECUTABLE_PATH=$BROWSER" >> "$GITHUB_ENV"
          mkdir -p artifacts/curveread-checks
          git rev-parse HEAD > artifacts/curveread-checks/revision.txt
      - name: 500 desktop loads and the complete five-specimen practical
        run: node --experimental-strip-types --import ./scripts/register-alias.mjs scripts/browser-curriculum-audit.mjs --desktop --curveread --repeat=500
      - name: All desktop curriculum cases with page isolation
        if: ${{ !cancelled() }}
        run: node --experimental-strip-types --import ./scripts/register-alias.mjs scripts/browser-curriculum-audit.mjs --desktop
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: curveread-desktop-${{ matrix.mode }}
          path: |
            artifacts/curriculum-audit/browser*/
            artifacts/curveread-checks/revision.txt
          retention-days: 7
